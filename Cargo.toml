[workspace]
members = ["crates/dk-core", "crates/dk"]
resolver = "2"

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/ADkun/dk"
homepage = "https://github.com/ADkun/dk"
readme = "README.md"

[workspace.dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
anyhow = "1"
ignore = "0.4"
dk-core = { path = "crates/dk-core" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
